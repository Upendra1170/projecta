- name: mangodb
  host: mangodb
  become: yes
  tasks:
  - name: copy mangodb repo
    ansible.builtin.copy:
      src: mangodb repo 
      dest: /etc/yum.repos.d/mongdb.repo

  - name: install mangodb
    ansible.builtin.package:
      name: mongodb-org
      state: present

  - name: start and enable mangodb
    ansible.builtin.service:
      name: mongodb-org
      state: started
      enable: yes

  - name: allow remote connections
    ansible.builtin.replace:
      path: /etc/mongod.conf
      regexp: '54.164.150.236'
      replace: '0.0.0.0'

  - name: start and enable mangodb
    ansible.builtin.service:
      name: mongod
      state: restarted  
