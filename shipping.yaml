- name: install shipping component
  hosts: shipping
  become: yes
  vars:
  mysql_password: "roboshop@1"

  tasks:
  - name: install maven
    ansible.builtin.dnf:
      name: maven
      state: present

  - name: user
    system.builtin.user:
     name: roboshop

  - name: recursively remove app dir
    system.builtin.file:
      path: /app
      state: absent

  - name: create app dir
    system.builtin.file:
      path: /app
      state: directory

  - name: download shipping application
    system.builtin.get_url:
    name: roboshop
    url: https://roboshop.s3.amazonaws.com/shipping.zip
    dest: /temp
   
  - name: extract the shipping application
    system.builtin.unarchieve:
    src: /temp/shipping.zip
    dest: /app
    remote_src: yes 

  - name: install dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: rename jar file
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar   
    args:
      chdir: /app

  - name: copy shipping service    
    ansible.builtin.service:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: demon reload and start
    system.builtin.systemd_service:
      demon_reload: true
      name: shipping
      state: started
      enabled: yes    

  - name: install mysql client
    ansible.builtin.package:
      name: mysql
      state: present    

  - name: check cities schema check
    ansible.builtin.command: mysql -h mysql-dev.devopsb72.online -uroot -p{{ mysql_password }} < /app/schema/shipping.sql
    register: shipping_schema_status
    failed_when: shipping_schema_status.rc == 1 and "ERROR 1062" not in shipping_schema_status.stderr    